server {
    listen 80;
    server_name _;
    location = / {
        default_type text/html;
        return 200 '<!doctype html><html lang="en"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Deployment practice</title><h1>Deployment practice</h1><p><a href="/api/health">API health</a></p></html>';
    }
    location = /health {
        default_type text/plain;
        return 200 'ok';
    }
    resolver 127.0.0.11 valid=10s;
    set $api_upstream api:3000;
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }
}
