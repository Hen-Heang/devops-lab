services:
  api:
    image: "${API_IMAGE:?Set API_IMAGE to the verified image reference}"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.50"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    restart: unless-stopped
    ports:
      # Host-only diagnostics; public traffic is added through NPM in lesson 12.
      - "127.0.0.1:8088:80"
    mem_limit: 128m
    cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
