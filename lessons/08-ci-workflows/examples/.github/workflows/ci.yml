name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint source
        run: npm run lint
      - name: Check formatting
        run: npm run format:check

  test:
    name: Test + Coverage (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Test with coverage thresholds
        run: npm run coverage
      - name: Save coverage report
        if: ${{ always() && matrix.node == '24' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-node-24
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build Verification
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the runtime image
        run: docker build -t cicd-express-demo:ci .
      - name: Verify packaged API
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs ci-api; docker rm -f ci-api >/dev/null' EXIT
          docker run -d --name ci-api -p 127.0.0.1:3000:3000 cicd-express-demo:ci
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:3000/health > health.json
          docker exec ci-api node -e "if (process.getuid() === 0) process.exit(1)"
          docker exec ci-api node -e "fetch('http://127.0.0.1:3000/health').then(async r => { const body = await r.json(); if (!r.ok || body.status !== 'ok') process.exit(1); }).catch(() => process.exit(1))"

  quality-gate:
    name: Quality Gate
    needs: [lint, test, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful prerequisites
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        shell: bash
        run: |
          for result in "$LINT_RESULT" "$TEST_RESULT" "$BUILD_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Quality gate blocked: prerequisite result is $result"
              exit 1
            fi
          done
          echo "All required gates passed"
